  async req(m,p,b){

};

  const[staffNames,setStaffNames]=useState([]);
  const[settings,setSettings]=useState({sameDayMult:1,defaultRate:0.85});

  const[cleanerExtras,setCleanerExtras]=useState({});

  useEffect(()=>{localStorage.setItem('lang',lang)},[lang]);

    else setLoading(false);
    var safety=setTimeout(function(){setLoading(false)},30000);
    return function(){clearTimeout(safety)};
  },[]);

  const loadData=async()=>{
    try{
      const[o,c,e,s,sn]=await Promise.all([api.get('/orders'),api.get('/cleaners'),api.get('/extras'),api.get('/settings'),api.get('/staff-names')]);
      setOrders(o);setCleaners(c);setExtras(e);setSettings(s);setStaffNames(sn);
      const ceMap={};
      for(const cl of c){
        try{const ce=await api.get('/cleaners/'+cl.id+'/extras');ceMap[cl.id]={};ce.forEach(x=>{ceMap[cl.id][x.extra_id]=parseFloat(x.custom_price)})}catch(e){}
      }
      setCleanerExtras(ceMap);
    }catch(e){console.error(e)}
    setLoading(false);
  };

  const handleLogin=async(u,p)=>{const d=await api.post('/login',{username:u.toLowerCase().trim(),password:p});api.setToken(d.token);setUser(d.user);if(d.user.role==='driver'){setStaffName(d.user.username);setView('schedule')}else{setView('orders')}await loadData()};
  const handleLogout=()=>{api.clearToken();setUser(null);setOrders([]);sessionStorage.removeItem('staffName');setStaffName('');setView('orders')};
  const notify=m=>{setToast(m);setTimeout(()=>setToast(''),2000)};

  const calcTotal=(o,cid)=>{
    const c=cleaners.find(x=>x.id===cid);
    if(!c)return 0;
    const rate=parseFloat(c.rate);
    const w=parseFloat(o.weight)||0;
    const minW=parseFloat(c.min_weight)||10;
    const mult=o.service_type==='same-day'?settings.sameDayMult:1;
    const billW=w===0?0:Math.max(w,minW);
    const base=billW*rate*mult;
    const extT=(o.extras||[]).reduce((s,id)=>{
      const cp=cleanerExtras[cid]?.[id];
      const ex=extras.find(x=>x.id===id);
      return s+(cp!==undefined?cp:parseFloat(ex?.price||0));
    },0);
    return base+extT;
  };

  const isAdmin=user&&user.role==='admin';
  const isDriver=user&&user.role==='driver';

    React.createElement('div',{style:{background:'linear-gradient(90deg,#1e40af,#7c3aed)',padding:'16px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'8px'}},
      React.createElement('div',{style:{fontWeight:'bold',fontSize:'20px'}},t.appName),
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:'12px'}},
        staffName&&React.createElement('span',{style:{fontSize:'14px',background:'rgba(255,255,255,0.2)',padding:'4px 10px',borderRadius:'6px'}},'👤 '+staffName),
        React.createElement('button',{onClick:handleLogout,style:{background:'rgba(255,255,255,0.2)',border:'none',color:'#fff',padding:'6px 12px',borderRadius:'6px',cursor:'pointer'}},t.logout))),
    React.createElement('div',{className:'nav-tabs',style:{background:'#1e293b',padding:'8px 16px',display:'flex',gap:'8px',borderBottom:'1px solid #334155',flexWrap:'wrap'}},
      tabs.map(tab=>React.createElement('button',{key:tab,onClick:()=>setView(tab),style:{padding:'10px 16px',borderRadius:'8px',border:'none',cursor:'pointer',background:view===tab?'linear-gradient(90deg,#3b82f6,#8b5cf6)':'transparent',color:view===tab?'#fff':'#94a3b8',fontWeight:'500'}},t[tab]))),
    toast&&React.createElement('div',{style:{position:'fixed',top:20,right:20,background:'#065f46',color:'#fff',padding:'12px 20px',borderRadius:'8px',zIndex:999}},toast),
    React.createElement('div',{style:{maxWidth:'1000px',margin:'0 auto',padding:'20px'}},
      view==='orders'&&React.createElement(Orders,{orders,cleaners,extras,settings,cleanerExtras,notify,loadData,isAdmin,hasPerm,user,staffName,setStaffName,staffNames,setStaffNames,calcTotal,lang,t}),
      view==='cleaners'&&hasPerm('cleaners')&&React.createElement(Cleaners,{cleaners,extras,cleanerExtras,notify,loadData,t}),
      view==='extras'&&hasPerm('extras')&&React.createElement(Extras,{extras,notify,loadData,t}),
      view==='invoices'&&hasPerm('invoices')&&React.createElement(Invoices,{cleaners,extras,cleanerExtras,settings,t}),
      view==='payments'&&hasPerm('payments')&&React.createElement(Payments,{cleaners,settings,t}),
      view==='reports'&&hasPerm('reports')&&React.createElement(Reports,{t}),
      view==='errors'&&hasPerm('errors')&&React.createElement(Errors,{cleaners,extras,cleanerExtras,settings,notify,loadData,calcTotal,t}),

      view==='settings'&&hasPerm('settings')&&React.createElement(Settings,{settings,setSettings,notify,lang,setLang,loadData,isAdmin,t})));

function AvailabilityPanel({drivers,routes,shifts,weekOf,setWeekOf,addDays,dayNames,dayNums,notify,onRefresh}){

  const[viewWeek,setViewWeek]=useState(0);const[showRouteManager,setShowRouteManager]=useState(false);
  const[newRouteName,setNewRouteName]=useState('');const[newRouteShifts,setNewRouteShifts]=useState(false);const[newRouteDays,setNewRouteDays]=useState([1,2,3,4,5,6]);
  const[editRoute,setEditRoute]=useState(null);
  const[overrideModal,setOverrideModal]=useState(null);const[overrideSelections,setOverrideSelections]=useState([]);const[overrideNotes,setOverrideNotes]=useState('');
  const[showDebug,setShowDebug]=useState(false);const[loadError,setLoadError]=useState(null);const[lastLoad,setLastLoad]=useState(null);
  var currentWeekOf=addDays(weekOf,viewWeek*7);

  var routeColors={'East Cleaners':'#3b82f6','West Cleaners':'#8b5cf6','Laundry Day':'#06b6d4','Schools':'#f59e0b','Sleepy':'#ec4899','Panda':'#22c55e'};
  var getRouteColor=function(name){return routeColors[name]||'#94a3b8'};

  var normalizeDate=function(d){if(!d)return'';return d.toString().split('T')[0]};

  var loadData=async function(){setLd(true);setLoadError(null);
    var start=currentWeekOf;var end=addDays(currentWeekOf,5);
    try{
      var availResult=await api.get('/availability?start_date='+start+'&end_date='+end);
      console.log('ADMIN SCHEDULE: Loaded',availResult.length,'entries for',start,'to',end,availResult);
      setAvail(availResult);
      setLastLoad({time:new Date().toLocaleTimeString(),start:start,end:end,count:availResult.length,
        entries:availResult.map(function(a){return{id:a.id,driver:a.driver_name,driver_id:a.driver_id,date:normalizeDate(a.work_date),confirmed:a.confirmed,admin_confirmed:a.admin_confirmed,routes:(a.route_selections||[]).map(function(s){return s.route_name||('id:'+s.route_id)}).join(', ')||a.route_name||'none'}})});
      try{var covResult=await api.get('/availability/coverage?week_of='+start);
        setAssignments(covResult.assignments||[]);}catch(e){}
    }catch(e){console.error('ADMIN SCHEDULE LOAD ERROR:',e);setLoadError(e.message);setAvail([])}setLd(false)};
  useEffect(function(){loadData()},[viewWeek,weekOf]);

  var activeDrivers=drivers.filter(function(d){return d.status==='active'});
  var getDriverAvail=function(driverId,dateStr){
    var normDate=normalizeDate(dateStr);
    return avail.find(function(a){return String(a.driver_id)===String(driverId)&&normalizeDate(a.work_date)===normDate})};
  var getDriverAssigned=function(driverId,dayNum){return assignments.find(function(a){return String(a.driver_id)===String(driverId)&&a.day_of_week===dayNum})};

  var availCount=0;var assignedCount=0;var gapCount=0;var confirmedCount=0;
  dayNums.forEach(function(dn,i){var dateStr=addDays(currentWeekOf,i);
    activeDrivers.forEach(function(d){var av=getDriverAvail(d.id,dateStr);var asgn=getDriverAssigned(d.id,dn);
      if(asgn)assignedCount++;else if(av&&av.confirmed){availCount++;if(av.admin_confirmed)confirmedCount++}else gapCount++})});

  var confirmOne=async function(id){try{await api.put('/availability/'+id+'/confirm');notify('Confirmed');loadData()}catch(e){alert(e.message)}};
  var confirmAll=async function(){
    var start=currentWeekOf;var end=addDays(currentWeekOf,5);
    if(!confirm('Confirm ALL driver availability for this week as final? Drivers will not be able to cancel.'))return;
    try{var res=await api.put('/availability/confirm-week',{start_date:start,end_date:end});notify(res.confirmed+' schedules confirmed');loadData()}catch(e){alert(e.message)}};

  var adminOverride=async function(){
    if(!overrideModal||overrideSelections.length===0){alert('Select at least one route');return}
    var finalSelections=overrideSelections.map(function(s){return{route_id:s.route_id,shift:s.shift||'Full Day'}});
    try{await api.post('/availability',{
      driver_id:overrideModal.driverId,work_date:overrideModal.date,status:'available',
      route_selections:finalSelections,
      notes:overrideNotes||null,confirmed:true,admin_confirmed:true});
    setOverrideModal(null);notify('Schedule assigned');loadData()}catch(e){alert(e.message)}};

  var toggleOverrideRoute=function(routeId){
    var rid=parseInt(routeId);var existing=overrideSelections.find(function(s){return parseInt(s.route_id)===rid});
    if(existing){setOverrideSelections(overrideSelections.filter(function(s){return parseInt(s.route_id)!==rid}))}
    else{
      var newRoute=routes.find(function(r){return r.id===rid});var newName=(newRoute?newRoute.name:'').toLowerCase();
      var conflict=false;

        if((newName.includes('east')&&rName.includes('west'))||(newName.includes('west')&&rName.includes('east')))conflict=true});
      if(conflict){alert('East and West routes cannot be selected together - time conflict');return}
      setOverrideSelections(overrideSelections.concat([{route_id:rid,shift:null}]))}};

  var setOverrideRouteShift=function(routeId,shift){
    setOverrideSelections(overrideSelections.map(function(s){return parseInt(s.route_id)===parseInt(routeId)?{...s,shift:shift}:s}))};

  var addRoute=async function(){if(!newRouteName.trim()){alert('Route name required');return}
    if(newRouteDays.length===0){alert('Select at least one active day');return}
    try{await api.post('/routes',{name:newRouteName.trim(),has_shifts:newRouteShifts,active_days:newRouteDays});setNewRouteName('');setNewRouteShifts(false);setNewRouteDays([1,2,3,4,5,6]);notify('Route added');onRefresh()}catch(e){alert(e.message)}};
  var updateRoute=async function(id,data){try{await api.put('/routes/'+id,data);notify('Saved');onRefresh()}catch(e){alert(e.message)}};
  var deactivateRoute=async function(id){if(!confirm('Deactivate this route?'))return;try{await api.put('/routes/'+id,{status:'inactive'});notify('Route deactivated');onRefresh()}catch(e){alert(e.message)}};

  var exportDriverPDF=function(driverFilter){

    if(driversToExport.length===0){alert('No locked schedules to export. Lock driver schedules first.');return}

        var dayDate=new Date(dateStr+'T12:00:00');

        var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

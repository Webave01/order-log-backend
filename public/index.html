const api={
  token:localStorage.getItem('token'),
  setToken(t){this.token=t;localStorage.setItem('token',t)},
  clearToken(){this.token=null;localStorage.removeItem('token')},
  async req(m,p,b){
    const o={method:m,headers:{'Content-Type':'application/json'}};
    if(this.token)o.headers['Authorization']='Bearer '+this.token;
    if(b)o.body=JSON.stringify(b);
    const r=await fetch(API+p,o);
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Error');
    return d;
  },
  get(p){return this.req('GET',p)},
  post(p,b){return this.req('POST',p,b)},
  put(p,b){return this.req('PUT',p,b)},
  del(p){return this.req('DELETE',p)}
};

const fmt$=n=>'$'+Number(n||0).toFixed(2);

const fmtDF=d=>{if(!d)return'';try{const s=d.toString().split('T')[0];const p=s.split('-');if(p.length!==3)return d;const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return months[parseInt(p[1])-1]+' '+parseInt(p[2])+', '+p[0]}catch(e){return d||''}};

  const[loading,setLoading]=useState(true);
  const[view,setView]=useState('orders');
  const[orders,setOrders]=useState([]);
  const[cleaners,setCleaners]=useState([]);
  const[extras,setExtras]=useState([]);
  const[staffNames,setStaffNames]=useState([]);
  const[settings,setSettings]=useState({sameDayMult:1,defaultRate:0.85});
  const[toast,setToast]=useState('');
  const[lang,setLang]=useState(localStorage.getItem('lang')||'en');
  const[staffName,setStaffName]=useState(sessionStorage.getItem('staffName')||'');
  const[cleanerExtras,setCleanerExtras]=useState({});
  const t=T[lang];

  useEffect(()=>{localStorage.setItem('lang',lang)},[lang]);
  useEffect(()=>{sessionStorage.setItem('staffName',staffName)},[staffName]);
  useEffect(()=>{
    if(api.token){api.get('/me').then(d=>{setUser(d.user);loadData()}).catch(()=>{api.clearToken();setLoading(false)})}
    else setLoading(false);
  },[]);

  const loadData=async()=>{
    try{
      const[o,c,e,s,sn]=await Promise.all([api.get('/orders'),api.get('/cleaners'),api.get('/extras'),api.get('/settings'),api.get('/staff-names')]);
      setOrders(o);setCleaners(c);setExtras(e);setSettings(s);setStaffNames(sn);
      const ceMap={};
      for(const cl of c){
        try{const ce=await api.get('/cleaners/'+cl.id+'/extras');ceMap[cl.id]={};ce.forEach(x=>{ceMap[cl.id][x.extra_id]=parseFloat(x.custom_price)})}catch(e){}
      }
      setCleanerExtras(ceMap);
    }catch(e){console.error(e)}
    setLoading(false);
  };

  const handleLogin=async(u,p)=>{const d=await api.post('/login',{username:u,password:p});api.setToken(d.token);setUser(d.user);await loadData()};
  const handleLogout=()=>{api.clearToken();setUser(null);setOrders([]);sessionStorage.removeItem('staffName');setStaffName('')};
  const notify=m=>{setToast(m);setTimeout(()=>setToast(''),2000)};

  const calcTotal=(o,cid)=>{
    const c=cleaners.find(x=>x.id===cid);
    if(!c)return 0;
    const rate=parseFloat(c.rate);
    const w=parseFloat(o.weight)||0;
    const minW=parseFloat(c.min_weight)||10;
    const mult=o.service_type==='same-day'?settings.sameDayMult:1;
    const billW=w===0?0:Math.max(w,minW);
    const base=billW*rate*mult;
    const extT=(o.extras||[]).reduce((s,id)=>{
      const cp=cleanerExtras[cid]?.[id];
      const ex=extras.find(x=>x.id===id);
      return s+(cp!==undefined?cp:parseFloat(ex?.price||0));
    },0);
    return base+extT;
  };

  if(loading)return React.createElement('div',{style:{minHeight:'100vh',background:'#0f172a',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}},t.loading);
  if(!user)return React.createElement(Login,{onLogin:handleLogin,lang,setLang,t});

  const isAdmin=user.role==='admin';
  const tabs=isAdmin?['orders','cleaners','extras','invoices','payments','reports','errors','settings']:['orders'];

  return React.createElement('div',{style:{minHeight:'100vh',background:'#0f172a',color:'#e2e8f0',fontFamily:'system-ui'}},
    React.createElement('div',{style:{background:'linear-gradient(90deg,#1e40af,#7c3aed)',padding:'16px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'8px'}},
      React.createElement('div',{style:{fontWeight:'bold',fontSize:'20px'}},t.appName),
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:'12px'}},
        staffName&&React.createElement('span',{style:{fontSize:'14px',background:'rgba(255,255,255,0.2)',padding:'4px 10px',borderRadius:'6px'}},'👤 '+staffName),
        React.createElement('button',{onClick:handleLogout,style:{background:'rgba(255,255,255,0.2)',border:'none',color:'#fff',padding:'6px 12px',borderRadius:'6px',cursor:'pointer'}},t.logout))),
    React.createElement('div',{style:{background:'#1e293b',padding:'8px 16px',display:'flex',gap:'8px',borderBottom:'1px solid #334155',flexWrap:'wrap'}},
      tabs.map(tab=>React.createElement('button',{key:tab,onClick:()=>setView(tab),style:{padding:'10px 16px',borderRadius:'8px',border:'none',cursor:'pointer',background:view===tab?'linear-gradient(90deg,#3b82f6,#8b5cf6)':'transparent',color:view===tab?'#fff':'#94a3b8',fontWeight:'500'}},t[tab]))),
    toast&&React.createElement('div',{style:{position:'fixed',top:20,right:20,background:'#065f46',color:'#fff',padding:'12px 20px',borderRadius:'8px',zIndex:999}},toast),
    React.createElement('div',{style:{maxWidth:'1000px',margin:'0 auto',padding:'20px'}},
      view==='orders'&&React.createElement(Orders,{orders,cleaners,extras,settings,cleanerExtras,notify,loadData,isAdmin,staffName,setStaffName,staffNames,setStaffNames,calcTotal,lang,t}),
      view==='cleaners'&&isAdmin&&React.createElement(Cleaners,{cleaners,extras,cleanerExtras,notify,loadData,t}),
      view==='extras'&&isAdmin&&React.createElement(Extras,{extras,notify,loadData,t}),
      view==='invoices'&&isAdmin&&React.createElement(Invoices,{cleaners,extras,cleanerExtras,settings,t}),
      view==='payments'&&isAdmin&&React.createElement(Payments,{cleaners,settings,t}),
      view==='reports'&&isAdmin&&React.createElement(Reports,{t}),
      view==='errors'&&isAdmin&&React.createElement(Errors,{cleaners,t}),
      view==='settings'&&isAdmin&&React.createElement(Settings,{settings,setSettings,notify,lang,setLang,loadData,t})));
}

function Login({onLogin,lang,setLang,t}){
  const[u,setU]=useState('');const[p,setP]=useState('');const[err,setErr]=useState('');const[ld,setLd]=useState(false);
  const sub=async e=>{e.preventDefault();setErr('');setLd(true);try{await onLogin(u,p)}catch(e){setErr(e.message)}setLd(false)};
  return React.createElement('div',{style:{minHeight:'100vh',background:'#0f172a',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}},
    React.createElement('div',{style:{background:'#1e293b',padding:'40px',borderRadius:'16px',width:'100%',maxWidth:'360px',border:'1px solid #334155'}},
      React.createElement('h1',{style:{color:'#fff',textAlign:'center',marginBottom:'24px',fontSize:'28px'}},t.appName),
      React.createElement('div',{style:{display:'flex',justifyContent:'center',gap:'8px',marginBottom:'20px'}},
        React.createElement('button',{onClick:()=>setLang('en'),style:{padding:'6px 12px',borderRadius:'6px',border:lang==='en'?'2px solid #3b82f6':'1px solid #475569',background:lang==='en'?'rgba(59,130,246,0.2)':'transparent',color:'#fff',cursor:'pointer'}},'English'),
        React.createElement('button',{onClick:()=>setLang('es'),style:{padding:'6px 12px',borderRadius:'6px',border:lang==='es'?'2px solid #3b82f6':'1px solid #475569',background:lang==='es'?'rgba(59,130,246,0.2)':'transparent',color:'#fff',cursor:'pointer'}},'Español')),
      React.createElement('form',{onSubmit:sub},
        err&&React.createElement('div',{style:{background:'#991b1b',color:'#fff',padding:'10px',borderRadius:'8px',marginBottom:'16px',textAlign:'center'}},err),
        React.createElement('div',{style:{marginBottom:'16px'}},React.createElement('label',{style:S.lbl},t.username),React.createElement('input',{value:u,onChange:e=>setU(e.target.value),style:S.inp,disabled:ld})),
        React.createElement('div',{style:{marginBottom:'20px'}},React.createElement('label',{style:S.lbl},t.password),React.createElement('input',{type:'password',value:p,onChange:e=>setP(e.target.value),style:S.inp,disabled:ld})),
        React.createElement('button',{type:'submit',disabled:ld,style:{...S.btn,width:'100%',padding:'14px',fontSize:'16px',opacity:ld?0.6:1}},ld?'...':t.signIn))));
}

function DateTime(){
  const[now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t)},[]);
  return React.createElement('div',{style:{textAlign:'center',marginBottom:'16px',color:'#94a3b8',fontSize:'14px'}},
    now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' • '+now.toLocaleTimeString());
}

  const[showOther,setShowOther]=useState(false);const[other,setOther]=useState('');
  const names=staffNames.map(s=>s.name);
  if(staffName)return React.createElement('div',{style:{background:'#065f46',padding:'12px 16px',borderRadius:'8px',marginBottom:'16px',display:'flex',justifyContent:'space-between',alignItems:'center'}},
    React.createElement('span',null,'👤 '+t.staffName+': ',React.createElement('strong',null,staffName)),

  return React.createElement('div',{style:{background:'#1e293b',padding:'16px',borderRadius:'12px',marginBottom:'16px',border:'2px solid #f59e0b'}},
    React.createElement('div',{style:{color:'#f59e0b',fontWeight:'bold',marginBottom:'12px',fontSize:'14px'}},'👤 '+t.selectStaff),

    showOther&&React.createElement('div',{style:{display:'flex',gap:'8px'}},
      React.createElement('input',{value:other,onChange:e=>setOther(e.target.value),style:{...S.inp,flex:1},onKeyPress:e=>e.key==='Enter'&&other.trim()&&setStaffName(other.trim())}),

function Orders({orders,cleaners,extras,settings,cleanerExtras,notify,loadData,isAdmin,staffName,setStaffName,staffNames,setStaffNames,calcTotal,lang,t}){
  const[showForm,setShowForm]=useState(false);const[editing,setEditing]=useState(null);const[search,setSearch]=useState('');const[showImport,setShowImport]=useState(false);
  const[searchResults,setSearchResults]=useState(null);const[searching,setSearching]=useState(false);const[filterCleaner,setFilterCleaner]=useState('');
  const[showStaffMgmt,setShowStaffMgmt]=useState(false);const[newStaffName,setNewStaffName]=useState('');
  
  const doSearch=async(term)=>{
    setSearch(term);
    if(term.length>=2){
      setSearching(true);
      try{
        const results=await api.get('/orders?search='+encodeURIComponent(term));
        setSearchResults(results);
      }catch(e){console.error(e)}
      setSearching(false);
    }else{
      setSearchResults(null);
    }
  };
  
  const displayOrders=searchResults!==null?searchResults:orders;
  const filtered=displayOrders.filter(o=>{
    const c=cleaners.find(c=>c.id===o.cleaner_id);
    const matchesSearch=!search||o.order_num.includes(search)||(c?.name||'').toLowerCase().includes(search.toLowerCase());
    const matchesCleaner=!filterCleaner||o.cleaner_id===parseInt(filterCleaner);
    return matchesSearch&&matchesCleaner;
  });
  const save=async d=>{try{if(editing){await api.put('/orders/'+d.id,d);notify('Updated')}else{await api.post('/orders',d);notify('Added')}await loadData();setSearchResults(null);setSearch('');setShowForm(false);setEditing(null)}catch(e){alert(e.message)}};
  const del=async id=>{if(!confirm(t.delete+'?'))return;try{await api.del('/orders/'+id);notify('Deleted');await loadData();if(search)doSearch(search)}catch(e){alert(e.message)}};
  const exp=async()=>{try{const d=await api.get('/orders/export');const rows=d.orders.map(o=>({'Order #':o.order_num,Cleaner:o.cleaner_name,Route:o.route,Weight:o.weight,'Rate/lb':o.rate_per_lb,Service:o.service_type,'Pickup Date':fmtDF(o.pickup_date),Created:o.created_at?fmtD(o.created_at)+' '+fmtTime(o.created_at):'','Bag Color':o.bag_color,Extras:o.extras,'Extras $':o.extras_total,Total:o.total,Notes:o.notes,'Entered By':o.staff_name}));const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Orders');XLSX.writeFile(wb,'orders_'+new Date().toISOString().split('T')[0]+'.xlsx');notify('Exported')}catch(e){alert(e.message)}};
  const addStaff=async()=>{if(!newStaffName.trim())return;try{await api.post('/staff-names',{name:newStaffName.trim()});const sn=await api.get('/staff-names');setStaffNames(sn);setNewStaffName('');notify('Added')}catch(e){alert(e.message||'Error')}};
  const delStaff=async(id,name)=>{if(!confirm('Delete '+name+'?'))return;try{await api.del('/staff-names/'+id);const sn=await api.get('/staff-names');setStaffNames(sn);notify('Deleted')}catch(e){alert(e.message)}};
  const handleNew=()=>{if(!staffName){alert('Select name first');return}setEditing(null);setShowForm(true)};
  const groupExtras=(extraIds)=>{const groups={};(extraIds||[]).forEach(id=>{const ex=extras.find(e=>e.id===id);if(ex){const cat=ex.category||'Other';if(!groups[cat])groups[cat]=[];groups[cat].push(ex.name)}});return groups};

  return React.createElement('div',null,
    React.createElement(DateTime),
    React.createElement(StaffSelector,{staffName,setStaffName,staffNames,t}),
    React.createElement('div',{style:{textAlign:'center',marginBottom:'24px'}},
      React.createElement('button',{onClick:handleNew,style:{...S.btn,padding:'20px 60px',fontSize:'22px',fontWeight:'bold',opacity:staffName?1:0.5,boxShadow:'0 4px 15px rgba(59,130,246,0.4)'}},t.newOrder)),
    isAdmin&&React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px',flexWrap:'wrap',gap:'12px'}},
      React.createElement('h2',{style:{margin:0,fontSize:'22px'}},t.orders),
      React.createElement('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},

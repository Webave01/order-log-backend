<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Statement Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1e293b;padding:24px;text-align:center;border-bottom:2px solid #10b981}
.header h1{font-size:24px;font-weight:700;color:#fff;margin-bottom:2px}
.header p{color:#64748b;font-size:13px}
.container{max-width:700px;margin:0 auto;padding:24px 16px 60px}
.card{background:#1e293b;border-radius:12px;border:1px solid #334155;padding:20px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.green{color:#10b981}.red{color:#f87171}.blue{color:#60a5fa}.purple{color:#c4b5fd}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.field input,.field select{width:100%;padding:10px 12px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:#10b981}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line-item{display:grid;grid-template-columns:2fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.line-item input{padding:8px 10px;background:#0f172a;border:1px solid #475569;border-radius:6px;color:#e2e8f0;font-size:14px;font-family:inherit}
.line-item input:focus{outline:none;border-color:#10b981}
.remove-btn{width:36px;height:36px;border-radius:6px;border:1px solid #ef4444;background:transparent;color:#ef4444;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.remove-btn:hover{background:rgba(239,68,68,0.1)}
.add-btn{padding:8px 16px;border-radius:6px;border:1px dashed #475569;background:transparent;color:#94a3b8;cursor:pointer;font-size:13px;font-family:inherit;width:100%;transition:all 0.2s}
.add-btn:hover{border-color:#10b981;color:#10b981}
.total-row{display:flex;justify-content:space-between;padding:10px 0;font-weight:700}
.total-row.sub{border-top:2px solid #334155;margin-top:8px;font-size:15px}
.total-row.net{border-top:3px double #8b5cf6;margin-top:12px;font-size:20px;padding:16px 0;color:#fff}
.tax-row{display:grid;grid-template-columns:24px 1.5fr 70px 80px;gap:8px;align-items:center;margin-bottom:8px;padding:6px 8px;border-radius:6px;background:#0f172a}
.tax-row input[type=checkbox]{width:18px;height:18px;accent-color:#3b82f6}
.tax-row .tax-name{font-size:13px;color:#cbd5e1}
.tax-row input[type=number]{padding:6px 8px;background:#1e293b;border:1px solid #475569;border-radius:4px;color:#e2e8f0;font-size:13px;font-family:inherit;text-align:right;width:100%}
.tax-row .tax-amt{font-size:13px;color:#f87171;text-align:right;font-weight:600}
.gen-btn{width:100%;padding:16px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s}
.gen-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(16,185,129,0.3)}
@media(max-width:600px){.row{grid-template-columns:1fr}.tax-row{grid-template-columns:24px 1fr 60px 70px}.line-item{grid-template-columns:1fr 80px 36px}}
</style>
</head>
<body>
<div class="header">
<h1>💰 Pay Statement Generator</h1>
<p>Create payroll statement with tax withholdings for Zelle payment</p>
</div>
<div class="container" id="app"></div>
<script>
var API=window.location.origin+'/api';
var driverNames=[];
var driverNames=[];
var state={
  companyName:'WEBSTER AVE LAUNDROMAT',companyPhone:'347-632-2024',
  driverName:'',payPeriodStart:'',payPeriodEnd:'',payDate:'',
  earnings:[{desc:'Regular Routes',amount:''}],
  taxes:[
    {name:'Federal Income Tax',rate:10,enabled:true},
    {name:'Social Security',rate:6.2,enabled:true},
    {name:'Medicare',rate:1.45,enabled:true},
    {name:'NY State Income Tax',rate:4,enabled:true},
    {name:'NYC Income Tax',rate:3.078,enabled:false},
    {name:'NY SDI',rate:0.5,enabled:false},
    {name:'NY Paid Family Leave',rate:0.455,enabled:false}
  ],
  deductions:[{desc:'',amount:''}],
  notes:''
};

function $(id){return document.getElementById(id)}
function fmtC(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtD(d){if(!d)return'';var p=d.split('-');return p[1]+'/'+p[2]+'/'+p[0].slice(2)}

function totalEarnings(){return state.earnings.reduce(function(s,e){return s+(parseFloat(e.amount)||0)},0)}
function totalTaxes(){var gross=totalEarnings();return state.taxes.filter(function(t){return t.enabled}).reduce(function(s,t){return s+gross*(t.rate/100)},0)}
function totalDeductions(){return state.deductions.reduce(function(s,d){return s+(parseFloat(d.amount)||0)},0)}
function netPay(){return totalEarnings()-totalTaxes()-totalDeductions()}

function updateTotals(){
  var te=totalEarnings(),tt=totalTaxes(),td=totalDeductions(),np=netPay();
  // Update tax amounts
  state.taxes.forEach(function(t,i){
    var el=document.querySelector('.tax-amt-'+i);
    if(el)el.textContent=t.enabled?'-'+fmtC(te*(t.rate/100)):'\u2014';
  });
  // Update all summary values
  var els=document.querySelectorAll('[data-total]');
  els.forEach(function(el){
    var k=el.dataset.total;
    if(k==='gross')el.textContent=fmtC(te);
    if(k==='taxes')el.textContent='-'+fmtC(tt);
    if(k==='deductions')el.textContent='-'+fmtC(td);
    if(k==='net')el.textContent=fmtC(np);
    if(k==='net')el.style.color=np>=0?'#4ade80':'#ef4444';
  });
}
function render(){
  var te=totalEarnings(),tt=totalTaxes(),td=totalDeductions(),np=netPay();
  var scrollY=window.scrollY;
  var focusInfo=null;
  var af=document.activeElement;
  if(af&&af.dataset){
    focusInfo=af.dataset.field?{sel:'[data-field="'+af.dataset.field+'"][data-idx="'+af.dataset.idx+'"][data-key="'+af.dataset.key+'"]'}:
              af.dataset.taxrate?{sel:'[data-taxrate="'+af.dataset.taxrate+'"]'}:
              af.dataset.tax?{sel:'[data-tax="'+af.dataset.tax+'"]'}:
              af.id?{sel:'#'+af.id}:null;
  }
  var c=document.getElementById('app');
  c.innerHTML=
    '<div class="card">'+
      '<div class="card-title green">\ud83d\udcc4 Statement Info</div>'+
      '<div class="field"><label>Driver Name</label>'+
      '<div style="display:flex;gap:8px">'+
        '<select id="driverSelect" style="flex:1;padding:10px 12px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit">'+
          '<option value="">-- Select Driver --</option>'+
          driverNames.map(function(n){return '<option value="'+esc(n)+'" '+(state.driverName===n?'selected':'')+'>'+esc(n)+'</option>'}).join('')+
        '</select>'+
        '<input id="driverName" value="'+esc(state.driverName)+'" placeholder="Or type name" style="flex:1;padding:10px 12px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit">'+
      '</div></div>'+
      '<div class="row">'+
        '<div class="field"><label>Pay Period Start</label><input type="date" id="ppStart" value="'+state.payPeriodStart+'"></div>'+
        '<div class="field"><label>Pay Period End</label><input type="date" id="ppEnd" value="'+state.payPeriodEnd+'"></div>'+
      '</div>'+
      '<div class="row">'+
        '<div class="field"><label>Pay Date</label><input type="date" id="payDate" value="'+state.payDate+'"></div>'+
        '<div class="field"><label>Payment Method</label><input value="Zelle" disabled style="opacity:0.6"></div>'+
      '</div>'+
    '</div>'+

    '<div class="card">'+
      '<div class="card-title green">\u2795 Earnings</div>'+
      state.earnings.map(function(e,i){
        return '<div class="line-item">'+
          '<input data-field="earnings" data-idx="'+i+'" data-key="desc" value="'+esc(e.desc)+'" placeholder="Description">'+
          '<input data-field="earnings" data-idx="'+i+'" data-key="amount" value="'+esc(e.amount)+'" placeholder="$0.00" type="number" step="0.01">'+
          (state.earnings.length>1?'<button class="remove-btn" data-remove="earnings" data-idx="'+i+'">✕</button>':'<div></div>')+
        '</div>';
      }).join('')+
      '<button class="add-btn" id="addEarning">+ Add Earning</button>'+
      '<div class="total-row sub green"><span>Gross Pay</span><span data-total="gross">'+fmtC(te)+'</span></div>'+
    '</div>'+

    '<div class="card" style="border-color:#3b82f6">'+
      '<div class="card-title blue">\ud83c\udfe6 Payroll Taxes</div>'+
      '<div style="font-size:11px;color:#64748b;margin-bottom:12px">Check/uncheck taxes. Edit rates as needed.</div>'+
      state.taxes.map(function(t,i){
        var amt=t.enabled?te*(t.rate/100):0;
        return '<div class="tax-row">'+
          '<input type="checkbox" data-tax="'+i+'" '+(t.enabled?'checked':'')+'>'+
          '<div class="tax-name" style="opacity:'+(t.enabled?1:0.4)+'">'+esc(t.name)+'</div>'+
          '<div style="display:flex;align-items:center;gap:2px"><input type="number" data-taxrate="'+i+'" value="'+t.rate+'" step="0.01" min="0" style="opacity:'+(t.enabled?1:0.4)+';width:55px"><span style="color:#64748b;font-size:12px">%</span></div>'+
          '<div class="tax-amt tax-amt-'+i+'" style="opacity:'+(t.enabled?1:0.3)+'">'+(t.enabled?'-'+fmtC(amt):'\u2014')+'</div>'+
        '</div>';
      }).join('')+
      '<button class="add-btn" id="addTax">+ Add Custom Tax</button>'+
      '<div class="total-row sub blue"><span>Total Taxes</span><span data-total="taxes">-'+fmtC(tt)+'</span></div>'+
    '</div>'+

    '<div class="card" style="border-color:#ef4444">'+
      '<div class="card-title red">\u2796 Other Deductions</div>'+
      state.deductions.map(function(d,i){
        return '<div class="line-item">'+
          '<input data-field="deductions" data-idx="'+i+'" data-key="desc" value="'+esc(d.desc)+'" placeholder="Gas advance, equipment, etc.">'+
          '<input data-field="deductions" data-idx="'+i+'" data-key="amount" value="'+esc(d.amount)+'" placeholder="$0.00" type="number" step="0.01">'+
          '<button class="remove-btn" data-remove="deductions" data-idx="'+i+'">✕</button>'+
        '</div>';
      }).join('')+
      '<button class="add-btn" id="addDeduction">+ Add Deduction</button>'+
      (td>0?'<div class="total-row sub red"><span>Total Deductions</span><span data-total="deductions">-'+fmtC(td)+'</span></div>':'')+
    '</div>'+

    '<div class="card" style="border-color:#8b5cf6">'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:13px;color:#94a3b8;margin-bottom:8px">'+
        '<div>Gross Pay</div><div style="text-align:right" data-total="gross">'+fmtC(te)+'</div>'+
        '<div>Taxes</div><div style="text-align:right;color:#f87171" data-total="taxes">-'+fmtC(tt)+'</div>'+
        (td>0?'<div>Deductions</div><div style="text-align:right;color:#f87171" data-total="deductions">-'+fmtC(td)+'</div>':'')+
      '</div>'+
      '<div class="total-row net"><span>Net Pay (Zelle)</span><span data-total="net" style="color:'+(np>=0?'#4ade80':'#ef4444')+'">'+fmtC(np)+'</span></div>'+
    '</div>'+

    '<div class="card">'+
      '<div class="card-title" style="color:#94a3b8">\ud83d\udcdd Notes</div>'+
      '<div class="field"><textarea id="notes" style="width:100%;padding:10px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:#e2e8f0;font-size:14px;font-family:inherit;min-height:60px;resize:vertical" placeholder="Optional notes">'+esc(state.notes)+'</textarea></div>'+
    '</div>'+

    '<button class="gen-btn" id="genBtn">\ud83d\udce4 Generate PDF Statement</button>';

  $('driverSelect').onchange=function(){if(this.value){state.driverName=this.value;$('driverName').value=this.value}};
  $('driverName').oninput=function(){state.driverName=this.value;$('driverSelect').value=''};
  $('ppStart').onchange=function(){state.payPeriodStart=this.value};
  $('ppEnd').onchange=function(){state.payPeriodEnd=this.value};
  $('payDate').onchange=function(){state.payDate=this.value};
  $('notes').oninput=function(){state.notes=this.value};
  $('addEarning').onclick=function(){state.earnings.push({desc:'',amount:''});render()};
  $('addDeduction').onclick=function(){state.deductions.push({desc:'',amount:''});render()};
  $('addTax').onclick=function(){state.taxes.push({name:'Custom Tax',rate:0,enabled:true});saveTaxRates();render()};
  $('genBtn').onclick=generatePDF;

  document.querySelectorAll('[data-field]').forEach(function(el){
    el.oninput=function(){
      state[this.dataset.field][parseInt(this.dataset.idx)][this.dataset.key]=this.value;
      if(this.dataset.key==='amount')updateTotals();
    };
  });
  document.querySelectorAll('[data-remove]').forEach(function(el){
    el.onclick=function(){state[this.dataset.remove].splice(parseInt(this.dataset.idx),1);render()};
  });
  document.querySelectorAll('[data-tax]').forEach(function(el){
    el.onchange=function(){state.taxes[parseInt(this.dataset.tax)].enabled=this.checked;saveTaxRates();render()};
  });
  document.querySelectorAll('[data-taxrate]').forEach(function(el){
    el.oninput=function(){
      var idx=parseInt(this.dataset.taxrate);
      state.taxes[idx].rate=parseFloat(this.value)||0;
      saveTaxRates();updateTotals();
    };
  });
  window.scrollTo(0,scrollY);
  if(focusInfo&&focusInfo.sel){var el=document.querySelector(focusInfo.sel);if(el){el.focus();if(el.type==='number'||el.type==='text'){var len=el.value.length;el.setSelectionRange(len,len)}}}
}

function generatePDF(){
  if(!state.driverName){alert('Enter driver name');return}
  var te=totalEarnings(),tt=totalTaxes(),td=totalDeductions(),np=netPay();
  var doc=new jspdf.jsPDF();
  var pw=doc.internal.pageSize.getWidth();
  var lm=16,rm=pw-16;

  doc.setDrawColor(60,60,60);doc.setLineWidth(1.5);doc.line(lm,10,rm,10);
  doc.setFontSize(12);doc.setFont(undefined,'bold');doc.setTextColor(30,30,30);
  doc.text(state.companyName,lm,18);
  doc.setFontSize(8);doc.setFont(undefined,'normal');doc.setTextColor(100,100,100);
  doc.text(state.companyPhone,lm,22);
  doc.setFontSize(14);doc.setFont(undefined,'bold');doc.setTextColor(30,30,30);
  doc.text('PAY STATEMENT',rm,18,{align:'right'});
  doc.setDrawColor(180,180,180);doc.setLineWidth(0.3);doc.line(lm,25,rm,25);

  var y=31;
  doc.setFontSize(7);doc.setTextColor(120,120,120);
  doc.text('EMPLOYEE',lm,y);doc.text('PAY DATE',110,y);
  y+=4;doc.setFontSize(9);doc.setTextColor(30,30,30);doc.setFont(undefined,'bold');
  doc.text(state.driverName,lm,y);doc.setFont(undefined,'normal');doc.text(state.payDate?fmtD(state.payDate):'',110,y);
  y+=6;doc.setFontSize(7);doc.setTextColor(120,120,120);
  doc.text('PAY PERIOD',lm,y);doc.text('PAYMENT METHOD',110,y);
  y+=4;doc.setFontSize(9);doc.setTextColor(30,30,30);
  doc.text((state.payPeriodStart?fmtD(state.payPeriodStart):'')+' - '+(state.payPeriodEnd?fmtD(state.payPeriodEnd):''),lm,y);
  doc.text('Zelle',110,y);
  y+=5;doc.setDrawColor(220,220,220);doc.setLineWidth(0.2);doc.line(lm,y,rm,y);y+=4;

  var tblHead={fillColor:[50,50,50],textColor:[255,255,255],fontStyle:'bold',fontSize:7,cellPadding:3};
  var tblStyle={fontSize:8,cellPadding:{top:2.5,bottom:2.5,left:4,right:4},textColor:[40,40,40],lineColor:[230,230,230],lineWidth:0.1};
  var tblCols={0:{cellWidth:140},1:{cellWidth:40,halign:'right'}};
  var tblAlt={fillColor:[252,252,252]};
  var boldRow={fontStyle:'bold',fillColor:[245,245,245]};

  var earningRows=state.earnings.filter(function(e){return e.desc||e.amount}).map(function(e){return[e.desc,fmtC(e.amount)]});
  earningRows.push([{content:'GROSS PAY',styles:boldRow},{content:fmtC(te),styles:boldRow}]);
  doc.autoTable({startY:y,head:[['EARNINGS','AMOUNT']],body:earningRows,headStyles:tblHead,styles:tblStyle,columnStyles:tblCols,bodyStyles:{fillColor:[255,255,255]},alternateRowStyles:tblAlt,margin:{left:lm,right:16}});
  y=doc.lastAutoTable.finalY+3;

  var activeTaxes=state.taxes.filter(function(t){return t.enabled});
  if(activeTaxes.length>0){
    var taxRows=activeTaxes.map(function(t){return[t.name,'('+fmtC(te*(t.rate/100))+')']});
    taxRows.push([{content:'TOTAL TAXES',styles:boldRow},{content:'('+fmtC(tt)+')',styles:boldRow}]);
    doc.autoTable({startY:y,head:[['PAYROLL TAXES','AMOUNT']],body:taxRows,headStyles:tblHead,styles:tblStyle,columnStyles:tblCols,bodyStyles:{fillColor:[255,255,255]},alternateRowStyles:tblAlt,margin:{left:lm,right:16}});
    y=doc.lastAutoTable.finalY+3;
  }

  var deductionRows=state.deductions.filter(function(d){return d.desc||d.amount}).map(function(d){return[d.desc,'('+fmtC(d.amount)+')']});
  if(deductionRows.length>0){
    deductionRows.push([{content:'TOTAL DEDUCTIONS',styles:boldRow},{content:'('+fmtC(td)+')',styles:boldRow}]);
    doc.autoTable({startY:y,head:[['OTHER DEDUCTIONS','AMOUNT']],body:deductionRows,headStyles:tblHead,styles:tblStyle,columnStyles:tblCols,bodyStyles:{fillColor:[255,255,255]},alternateRowStyles:tblAlt,margin:{left:lm,right:16}});
    y=doc.lastAutoTable.finalY+3;
  }

  y+=2;doc.setDrawColor(50,50,50);doc.setLineWidth(0.5);
  var boxH=14+(tt>0?4:0)+(td>0?4:0);
  doc.rect(lm,y,rm-lm,boxH+16);
  doc.setFillColor(50,50,50);doc.rect(lm,y,rm-lm,7,'F');
  doc.setFontSize(7);doc.setFont(undefined,'bold');doc.setTextColor(255,255,255);
  doc.text('PAYMENT SUMMARY',lm+4,y+4.8);

  y+=10;doc.setFontSize(8);doc.setTextColor(80,80,80);doc.setFont(undefined,'normal');
  doc.text('Gross Pay',lm+4,y);doc.text(fmtC(te),rm-4,y,{align:'right'});
  if(tt>0){y+=4;doc.text('Taxes',lm+4,y);doc.text('('+fmtC(tt)+')',rm-4,y,{align:'right'})}
  if(td>0){y+=4;doc.text('Deductions',lm+4,y);doc.text('('+fmtC(td)+')',rm-4,y,{align:'right'})}

  y+=6;doc.setFillColor(40,40,40);doc.roundedRect(lm+2,y,rm-lm-4,10,1,1,'F');
  doc.setFontSize(10);doc.setFont(undefined,'bold');doc.setTextColor(255,255,255);
  doc.text('NET PAY',lm+8,y+7);doc.text(fmtC(np),rm-8,y+7,{align:'right'});

  if(state.notes){y+=18;doc.setFontSize(7);doc.setFont(undefined,'bold');doc.setTextColor(120,120,120);
    doc.text('NOTES',lm,y);y+=3.5;doc.setFont(undefined,'normal');doc.setTextColor(80,80,80);doc.setFontSize(8);
    doc.text(doc.splitTextToSize(state.notes,rm-lm),lm,y)}

  doc.setDrawColor(180,180,180);doc.setLineWidth(0.2);doc.line(lm,278,rm,278);
  doc.setFontSize(6.5);doc.setTextColor(160,160,160);doc.setFont(undefined,'normal');
  doc.text('This document is for informational purposes only and is not an official tax document.',pw/2,283,{align:'center'});
  doc.text('Payment via Zelle  |  '+state.companyName+'  |  '+state.companyPhone,pw/2,287,{align:'center'});

  doc.save('PayStatement_'+state.driverName.replace(/\s/g,'_')+'_'+(state.payDate||'undated')+'.pdf');
}

function esc(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// Load tax rates from server
function saveTaxRates(){}

async function init(){
  try{var r=await fetch(API+"/payroll-taxes");var d=await r.json();
    if(d.taxes&&Array.isArray(d.taxes)&&d.taxes.length>0){state.taxes=d.taxes}
  }catch(e){console.error("Tax load error:",e)}
  try{var r2=await fetch(API+"/driver-names");var d2=await r2.json();
    if(Array.isArray(d2))driverNames=d2;
  }catch(e){console.error("Driver names error:",e)}
  render();
}
init();
</script>
</body>
</html>
